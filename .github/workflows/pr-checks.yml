name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  file-size-check:
    name: File Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check modified file sizes
        run: |
          echo "Checking files modified in this PR..."

          files=$(git diff --name-only --diff-filter=d \
            "origin/${{ github.base_ref }}...HEAD")

          oversized=false

          for file in $files; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")

              echo "$file: $size bytes"

              if [ "$size" -gt 1048576 ]; then
                echo "::error file=$file::File is larger than 1 MB"
                oversized=true
              fi
            fi
          done

          if [ "$oversized" = true ]; then
            echo "❌ One or more files exceed the 1 MB limit."
            exit 1
          fi

          echo "✅ All modified files are within the 1 MB limit."

  branch-name-check:
    name: Branch Name Check
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Checking branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" =~ ^(feature|fix|docs)/.+$ ]]; then
            echo "✅ Branch name is valid."
          else
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo "Branch must follow one of these patterns:"
            echo "  feature/*"
            echo "  fix/*"
            echo "  docs/*"
            exit 1
          fi

  pr-body-check:
    name: PR Body Check
    runs-on: ubuntu-latest

    steps:
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$(echo "$PR_BODY" | xargs)" ]; then
            echo "::warning::PR description is empty. Please add a meaningful description."
            echo "⚠️ PR description is empty."
          else
            echo "✅ PR description is present."
          fi
