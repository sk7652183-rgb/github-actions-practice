name: To Run a Python Script
on:
  push:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
           python-version: "3.12"
      - name: Install dependencies
        run: |
           python -m pip install --upgrade pip

      - name: Run script
        run: python script.py
